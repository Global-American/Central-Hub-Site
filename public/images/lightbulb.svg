<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-label="Light bulb">
  <!-- Hanging light bulb in the site palette: navy socket (#1F447B), orange
       glass (#F99E36) and the ShipItSmart "it" mark as the filament, drawn
       glossy and outline-free like the branded parcel (images/parcel1.png). -->
  <defs>
    <radialGradient id="bulb-glow" cx="120" cy="190" r="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F99E36" stop-opacity="0.35" />
      <stop offset="0.6" stop-color="#F99E36" stop-opacity="0.12" />
      <stop offset="1" stop-color="#F99E36" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bulb-glass" cx="100" cy="160" r="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD596" />
      <stop offset="0.45" stop-color="#F99E36" />
      <stop offset="1" stop-color="#DE7C1C" />
    </radialGradient>
    <linearGradient id="bulb-socket" x1="100" y1="0" x2="140" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#163563" />
      <stop offset="0.3" stop-color="#3466A8" />
      <stop offset="0.6" stop-color="#1F447B" />
      <stop offset="1" stop-color="#122A4F" />
    </linearGradient>
    <linearGradient id="bulb-collar" x1="96" y1="0" x2="144" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9CEF2" />
      <stop offset="0.35" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#C4D6F5" />
    </linearGradient>
  </defs>

  <circle cx="120" cy="190" r="104" fill="url(#bulb-glow)" />

  <!-- Rays -->
  <g stroke="#F99E36" stroke-width="6" stroke-linecap="round">
    <line x1="181.3" y1="138.6" x2="195.1" y2="127.0" />
    <line x1="198.8" y1="176.1" x2="209.6" y2="174.2" />
    <line x1="195.2" y1="217.4" x2="212.1" y2="223.6" />
    <line x1="171.4" y1="251.3" x2="178.5" y2="259.7" />
    <line x1="120" y1="270" x2="120" y2="288" />
    <line x1="68.6" y1="251.3" x2="61.5" y2="259.7" />
    <line x1="44.8" y1="217.4" x2="27.9" y2="223.6" />
    <line x1="41.2" y1="176.1" x2="30.4" y2="174.2" />
    <line x1="58.7" y1="138.6" x2="44.9" y2="127.0" />
  </g>

  <!-- Cord and socket -->
  <path d="M120 0V44" stroke="#1F447B" stroke-width="4" stroke-linecap="round" />
  <rect x="112" y="40" width="16" height="12" rx="3" fill="#163563" />
  <path d="M100 66Q100 50 116 50H124Q140 50 140 66V102H100Z" fill="url(#bulb-socket)" />
  <g fill="#5B8BCB" opacity="0.55">
    <rect x="100" y="70" width="40" height="3" />
    <rect x="100" y="80" width="40" height="3" />
    <rect x="100" y="90" width="40" height="3" />
  </g>

  <!-- Glass -->
  <path d="M102 106C102 130 58 146 58 190A62 62 0 0 0 182 190C182 146 138 130 138 106Z" fill="url(#bulb-glass)" />

  <!-- "it" mark (from public/shipItSmartIcon.svg) as the filament -->
  <g fill="#1F447B" transform="translate(120 196) scale(0.046) translate(-1083 -974)">
    <path transform="translate(725,530)" d="m0 0h65l63 1 1 4-1 400 813 1 2 5-1 123-808 1-11 1v84l3 49 3 25 8 49 6 28 5 19 9 27 12 28 10 19 10 15 10 13 14 15 10 9 13 9 14 8 19 8 21 6 25 4 8 1h37l28-3 30-5 34-8 41-12 35-12 28-11 35-16 33-15 19-10 14-7 4-3-2-4-14-18-8-12-10-13-13-18-11-16-7-12-4-11-1-5v-18l4-11 6-11 10-13 11-9 11-5 13-3h69l144 3h85l5-4 9 1 28 9 11 3 9 11 11 15 7 11v10l-3 7-1 18-7 29-11 36-9 28-9 30-10 31-12 39-6 20-9 28-9 30-5 18-8 19-10 13-7 7-9 6-12 5-9 2h-12l-14-3-12-5-9-6-7-7-13-17-12-17-14-19-13-18-10-14-12-17-8-11-6-9-3-1-10 6-32 17-27 13-36 16-28 12-30 12-37 13-38 12-31 8-37 8-34 5-21 2h-42l-39-3-26-4-27-7-25-9-26-12-17-10-20-14-13-11-11-9-12-12-7-8-12-15-10-14-10-16-9-16-13-25-8-19-13-37-8-27-8-37-8-43-4-30-3-33-3-55-1-39v-19l1-61 1-490z" />
    <path transform="translate(509,666)" d="m0 0h110l17 1v926l-1 1-14 1h-113v-928z" />
    <path transform="translate(566,348)" d="m0 0 18 1 16 4 16 7 12 9 6 5 11 14 8 15 4 13 2 14v9l-2 16-5 15-7 13-12 14-9 8-14 9-12 5-16 4h-18l-17-4-13-5-11-6-10-8-8-8-9-13-7-16-3-11-1-7v-22l4-17 8-16 9-12 9-10 10-7 12-6 15-5z" />
  </g>

  <!-- Gloss -->
  <ellipse cx="77" cy="174" rx="7" ry="20" transform="rotate(22 77 174)" fill="#FFFFFF" opacity="0.6" />
  <circle cx="88" cy="146" r="4" fill="#FFFFFF" opacity="0.6" />

  <!-- Collar between socket and glass -->
  <rect x="96" y="100" width="48" height="12" rx="4" fill="url(#bulb-collar)" />
</svg>
